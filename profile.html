<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c42"><title>প্রার্থী পরিচিতি | আমরা খুবি’য়ান</title><style>
:root{--navy:#071c42;--blue:#174e91;--gold:#ffcf4a;--ink:#14213a;--muted:#607089}*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:var(--ink);font-family:system-ui,'Noto Sans Bengali','Hind Siliguri',sans-serif}a{color:#1659a5}header{background:var(--navy);color:white;padding:17px 22px}header .nav{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}header .brand{color:var(--gold);font-size:22px;font-weight:900;text-decoration:none}header .back{color:white;font-size:14px;text-decoration:none}.shell{max-width:1050px;margin:32px auto 65px;padding:0 18px}.profile{background:white;border-radius:22px;border:1px solid #e0e8f2;box-shadow:0 12px 34px #132f5412;padding:clamp(18px,4vw,42px)}.head{display:flex;gap:30px;align-items:center;padding-bottom:30px;border-bottom:1px solid #e5ebf3}.portrait{width:210px;min-width:210px;height:240px;background:#e9eff8;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:#789;font-size:65px}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 18%}.role{font-size:12px;font-weight:850;letter-spacing:.6px;text-transform:uppercase;color:#1956a0}.head h1{font-size:clamp(27px,4vw,42px);line-height:1.25;margin:10px 0}.meta{color:#607089;font-size:16px}.pill{display:inline-block;background:#edf4ff;color:#24588b;padding:7px 11px;border-radius:8px;font-size:13px;margin-top:14px}.sections{display:grid;gap:20px;margin-top:28px}.info{padding-bottom:18px;border-bottom:1px solid #eef1f6}.info h2,.activity h2{color:#18477c;font-size:21px;margin:0 0 10px}.info p{line-height:1.9;white-space:pre-line;margin:0;font-size:16px}.info a{font-weight:700;overflow-wrap:anywhere}.initiatives{padding-left:25px;line-height:1.9;margin:8px 0}.initiatives li{margin-bottom:8px}.activity{margin-top:32px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.photos a{display:block}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px}.note{color:var(--muted);line-height:1.7}.actions{margin:24px 0;display:flex;gap:12px;flex-wrap:wrap}.actions a{display:inline-block;background:#e9f2ff;color:#164c90;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:12px}footer{text-align:center;background:#061631;color:#dbe8fb;padding:26px}@media(max-width:620px){.head{flex-direction:column;align-items:flex-start;gap:18px}.portrait{width:150px;min-width:150px;height:170px}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="nav"><a class="brand" href="index.html">আমরা খুবি’য়ান</a><a class="back" href="index.html#candidates">← সব প্রার্থী</a></div></header><main class="shell"><div id="content" class="profile"><p class="note">প্রার্থীর পরিচিতি লোড হচ্ছে…</p></div><div class="actions"><a href="index.html#candidates">← সব প্রার্থী দেখুন</a></div></main><footer>আমরা খুবি’য়ান · KUAA Election 2026</footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getJson(path){const response=await fetch(path,{cache:'no-store'});if(!response.ok)throw new Error(path);return response.json()}
function tryPhotoExtension(img){const original=img.dataset.original||img.getAttribute('src');if(!original)return;img.dataset.original=original;const match=original.match(/\.(jpg|jpeg|png|webp)$/i);if(!match)return;const stem=original.slice(0,-match[0].length),ext=match[1].toLowerCase();const options=['jpg','jpeg','png','webp'].filter(x=>x!==ext);const idx=Number(img.dataset.attempt||0);if(idx<options.length){img.dataset.attempt=String(idx+1);img.src=stem+'.'+options[idx]}else{img.onerror=null;img.replaceWith(document.createTextNode('👤'))}}
function photoFor(c){return c.photo||((c.roll&&/^\d+$/.test(c.roll))?`images/candidates/${c.roll}.jpg`:'')}
function section(title,value){return value?`<section class="info"><h2>${esc(title)}</h2><p>${esc(value)}</p></section>`:''}
async function init(){const root=document.getElementById('content'),roll=new URLSearchParams(location.search).get('roll');if(!roll){root.innerHTML='<p class="note">প্রার্থী নির্বাচন করা হয়নি।</p>';return}try{const [candidates,details]=await Promise.all([getJson('data.json'),getJson('profiles.json').catch(()=>({}))]);const c=candidates.find(x=>String(x.roll)===roll);if(!c){root.innerHTML='<p class="note">এই রোল নম্বরের প্রার্থী পাওয়া যায়নি।</p>';return}const d=details[roll]||{};document.title=c.name+' | আমরা খুবি’য়ান';const photo=photoFor(c);const fields=[['পেশাগত পরিচিতি',d.profession],['সাংগঠনিক কার্যক্রম',d.organization],['সামাজিক ও কল্যাণমূলক কাজ',d.socialWelfare],['KUAA-তে সম্পৃক্ততা',d.kuaaInvolvement],['KUAA সদস্যপদ',d.membershipStatus]];const list=Array.isArray(d.initiatives)?d.initiatives.filter(Boolean):[];const website=(typeof d.website==='string'&&/^https?:\/\//i.test(d.website))?`<section class="info"><h2>ওয়েবসাইট</h2><a href="${esc(d.website)}" target="_blank" rel="noopener noreferrer">${esc(d.website)} ↗</a></section>`:'';const photos=Array.isArray(d.activityPhotos)?d.activityPhotos.filter(Boolean):[];root.innerHTML=`<div class="head"><div class="portrait">${photo?`<img src="${esc(photo)}" alt="${esc(c.name)}" onerror="tryPhotoExtension(this)">`:'👤'}</div><div><div class="role">${esc(c.role)}</div><h1>${esc(c.name)}</h1><div class="meta">${esc(c.discipline)}${c.nick?' · '+esc(c.nick):''}</div><div class="pill">Roll: ${esc(c.roll)}</div></div></div><div class="sections">${fields.map(([t,v])=>section(t,v)).join('')}${list.length?`<section class="info"><h2>পরিকল্পনা ও অঙ্গীকার</h2><ul class="initiatives">${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:section('অন্যান্য তথ্য',d.other)}${website}</div>${photos.length?`<section class="activity"><h2>কার্যক্রমের ছবি</h2><div class="photos">${photos.map(p=>`<a href="${esc(p)}" target="_blank" rel="noopener noreferrer"><img src="${esc(p)}" alt="${esc(c.name)} activity" loading="lazy"></a>`).join('')}</div></section>`:''}${!fields.some(([,v])=>v)&&!list.length&&!d.other&&!d.website&&!photos.length?'<p class="note">বিস্তারিত পরিচিতি এখনও যুক্ত হয়নি।</p>':''}`;}catch(e){console.error(e);root.innerHTML='<p class="note">প্রার্থী তথ্য লোড করা যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।</p>'}}
init();
</script></body></html>
